<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dsh-sidebar-manager · 匿名示意</title>
<!--
  Anonymous preview page.

  The shell below imitates a DeepSeek Harness window, but the behaviour in it is
  the REAL plugin: lib/client.js is injected verbatim at the bottom of this file
  and its apply() runs against this DOM. Nothing here re-implements folding,
  hiding or dragging; if the plugin breaks, this page breaks.

  Only two things are fake:

    window.__ModuleLoader__   the host's tiny module registry, reduced to its
                             one relevant method: load({ id, factory }).
    ctx                      the host lifecycle context. The plugin touches a
                             single member, ctx.effect(fn, label), which runs
                             fn now and returns a disposer.

  Every panel name is invented. No real session, account or workspace name
  appears anywhere, which is the reason this page exists instead of a
  screenshot of the actual app.

  The host contract the plugin keys off, and that this page therefore has to
  reproduce exactly:

    nav[class*="panelList"][aria-label="全局面板"]
      > button[class*="panelRow"][aria-label="<name>"]   the rows
    div[data-conversation-tabs]
      > button[role="tab"][aria-selected]                the view tabs
    div[data-sidebar-right-guide]
      > div[class*="entryCell"] > [data-sidebar-right-guide-entry]
      > span[class*="moreAnchor"] > button[aria-haspopup="menu"]
-->
<style>
  /* ---- host shell, not part of the plugin ----
     Colours and metrics mirror the native sidebar so the plugin's own token
     lookups resolve to something plausible. */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #eef1f5;
    color: #0f1115;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* the theme tokens the plugin reads; values are the light-theme defaults */
  :root {
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-border-l1: #0000001a;
    --dsw-specific-sidebar-fill: #f9fafb;
    --dsw-radius-md: 12px;
    --dsw-radius-sm: 8px;
  }

  .app { display: flex; height: 640px; width: 1280px; margin: 0; background: #fff; }

  /* DSH 0.2.2-rc.1 GuideBody: direct entryCell and moreAnchor children. */
  .right { width: 340px; flex: none; padding: 1rem; border-left: 1px solid var(--dsw-alias-border-l1); }
  .geFEbW_guide { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
  .geFEbW_hero { margin: .75rem 0; color: var(--dsw-alias-label-tertiary); }
  .geFEbW_entryCell, .geFEbW_moreAnchor { width: 100%; max-width: 380px; }
  .geFEbW_moreAnchor { display: flex; }
  .geFEbW_entry {
    display: flex; align-items: center; gap: .75rem; width: 100%; min-width: 0;
    min-height: 56px; padding: .75rem 1rem; text-align: left;
    border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--dsw-radius-md);
    background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary);
    font: inherit; cursor: pointer;
  }
  .geFEbW_entry:hover { background: #2631480a; }
  .terminal_entry { position: relative; }
  .terminal_main { position: absolute; inset: 0; border: 0; border-radius: inherit; background: transparent; cursor: pointer; }
  .terminal_titleRow { display: flex; align-items: center; gap: .5rem; }
  .terminal_entry > .geFEbW_entryText { pointer-events: none; }
  .terminal_menu { position: relative; pointer-events: auto; }
  .terminal_trigger { display: flex; padding: .25rem; border: 0; background: transparent; color: inherit; cursor: pointer; }
  .geFEbW_entryText { min-width: 0; }
  .geFEbW_entryTitle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .geFEbW_entryDescription { display: block; font-size: .875rem; }

  /* ---------------- sidebar ---------------- */
  .side {
    width: 268px; flex: none;
    display: flex; flex-direction: column;
    padding: 14px 10px 10px;
    background: var(--dsw-specific-sidebar-fill);
    border-right: 1px solid var(--dsw-alias-border-l1);
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 14px; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: -.2px; }
  .brand span {
    font-size: 9px; letter-spacing: .09em; color: var(--dsw-alias-label-tertiary);
    border: 1px solid var(--dsw-alias-border-l1); border-radius: 4px; padding: 1px 4px;
  }
  .newchat {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    height: 34px; margin: 0 2px 12px;
    border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--dsw-radius-sm);
    background: #fff; color: var(--dsw-alias-label-primary);
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .newchat:hover { background: #2631480a; }

  /* the exact shape the plugin looks for: class contains "panelList" and the
     aria-label is the host's own name for the group */
  nav.panelList_x9 {
    display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
  }
  button.panelRow_x9 {
    display: flex; align-items: center; gap: 8px;
    min-height: 36px; padding: 7px 8px; margin: 0 2px;
    border: 0; border-radius: var(--dsw-radius-md);
    background: transparent; color: var(--dsw-alias-label-primary);
    font: inherit; font-size: 14px; line-height: 22px; font-weight: 500;
    text-align: left; cursor: pointer;
  }
  button.panelRow_x9:hover { background: #2631480f; }
  .glyph { width: 20px; flex: none; text-align: center; font-size: 15px; color: var(--dsw-alias-label-secondary); }
  .label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .work { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--dsw-alias-border-l1); }
  .work h4 {
    margin: 0; padding: 4px 8px 6px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; color: var(--dsw-alias-label-tertiary);
  }
  .work div {
    display: flex; align-items: center; gap: 8px; min-height: 32px;
    padding: 5px 8px; border-radius: var(--dsw-radius-md);
    font-size: 13px; color: var(--dsw-alias-label-secondary);
  }
  .work div:hover { background: #2631480f; }
  .grow { flex: 1 1 auto; }
  .foot {
    display: flex; align-items: center; gap: 8px; padding: 8px;
    border-top: 1px solid var(--dsw-alias-border-l1);
    font-size: 12px; color: var(--dsw-alias-label-tertiary);
  }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: #cfd6e0; flex: none; }

  /* ---------------- main column ---------------- */
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  /* the host header is a grid and holds the view tabs on its own row */
  .head {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 0 12px; padding: 14px 20px 0;
    border-bottom: 1px solid var(--dsw-alias-border-l1);
  }
  .title { font-size: 14px; font-weight: 600; padding-bottom: 10px; }
  .tools { display: flex; align-items: center; gap: 6px; padding-bottom: 10px; }
  .chip {
    padding: 3px 9px; border: 1px solid var(--dsw-alias-border-l1);
    border-radius: 999px; font-size: 11px; color: var(--dsw-alias-label-secondary);
    background: #fff;
  }
  /* the second contract: this attribute is how the plugin finds the strip */
  .tabs_x9 {
    grid-column: 1 / -1; display: flex; gap: 36px;
    margin-top: 10px; padding-left: 8px; position: relative;
  }
  .tabs_x9 button[role="tab"] {
    padding: 0 0 9px; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 500; line-height: 16px;
    color: var(--dsw-alias-label-secondary);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs_x9 button[role="tab"][aria-selected="true"] {
    color: var(--dsw-alias-label-primary); border-bottom-color: #4d6bfe;
  }

  /* ---------------- narration ----------------
     The caption column is what makes the animation readable: without it the
     viewer sees things fold and unfold but never learns why. Each phase swaps
     both lines, so the animation reads as a short explanation rather than a
     silent loop. It is NOT part of the plugin -- the plugin only ever touches
     the sidebar and the tab strip. */
  .body {
    flex: 1 1 auto; display: flex; flex-direction: column;
    padding: 40px 44px 26px; overflow: hidden;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: .18em; color: var(--dsw-alias-label-tertiary);
    min-height: 15px;
  }
  #headline {
    margin: 16px 0 0; font-size: 27px; font-weight: 680; letter-spacing: -.6px;
    line-height: 1.35; min-height: 74px;
  }
  .hairline {
    width: 100%; max-width: 380px; height: 1px; margin: 4px 0 0;
    background: linear-gradient(90deg, #0f11152e, transparent);
  }
  #details {
    margin: 16px 0 0; max-width: 420px; font-size: 14px; line-height: 1.85;
    color: var(--dsw-alias-label-secondary); min-height: 78px;
  }
  .footnote {
    margin-top: auto; font-size: 11.5px; color: var(--dsw-alias-label-tertiary);
  }

  /* the composer, so the window reads as a real session */
  .composer {
    display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 0 14px;
    border: 1px solid var(--dsw-alias-border-l1); border-radius: 14px;
    background: #fff; color: var(--dsw-alias-label-tertiary); font-size: 13px;
  }
  .send {
    margin-left: auto; width: 26px; height: 26px; border-radius: 8px;
    background: #0f1115; color: #fff; display: grid; place-items: center; font-size: 13px;
  }

  /* ---------------- scripted pointer ----------------
     A recording of a click with no pointer in it is unreadable: the list folds
     and nothing on screen explains who folded it. The sprite is decoration
     driven by the timeline; it never dispatches events itself. */
  #cursor {
    position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
    width: 22px; height: 27px; opacity: 0;
    filter: drop-shadow(0 2px 3px #00000066);
    transform-origin: 3px 2px;
  }
  #cursor[data-visible="true"] { opacity: 1; }
  #cursor[data-pressed="true"] { scale: .84; }
  #cursor svg { display: block; width: 100%; height: 100%; }
  /* the click ripple, so a press reads as a press and not as a jump */
  #cursor::after {
    content: ""; position: absolute; left: -9px; top: -9px; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid #4d6bfe; opacity: 0;
  }
  #cursor[data-pressed="true"]::after { animation: ripple .34s ease-out; }
  @keyframes ripple {
    from { opacity: .85; scale: .5; }
    to   { opacity: 0;   scale: 1.9; }
  }

  /* ---------------- compact mode (no narration) ----------------
     Same page, same plugin run, same timeline -- only the caption column is
     gone and the window narrows to match. Chosen by ?mode=compact so both cuts
     are produced from one source of truth instead of two drifting copies:
     two screenshots of the same code can always be trusted, two scripts that
     each script the interactions cannot. */
  .main[data-x-narration="off"] .body { display: none; }

</style>

<script>
/* ---- host module registry, reduced to what the plugin calls ----
   The real one also handles modules, versions and hot reload; the plugin only
   ever calls load() with an id and a factory. */
window.__ModuleLoader__ = {
  load({ id, factory }) {
    const api = factory();
    window.__modules = window.__modules || {};
    window.__modules[id] = api;
    return api;
  },
};

/* ---- host context, reduced to ctx.effect ----
   effect() runs the body immediately and keeps whatever it returns as the
   disposer, which is how the plugin tears itself down. */
const context = {
  effect(body) {
    const dispose = body();
    context.disposers.push(dispose);
    return dispose;
  },
  disposers: [],
};

/* the plugin injects itself into window.__ModuleLoader__ when it is evaluated */
</script>
<script src="../lib/client.js"></script>
<script>
/* ---- two cuts of one page ----
   ?mode=compact drops the caption column and narrows the window; everything
   else -- the plugin, the timeline, the assertions -- is shared. */
const MODE = new URL(location.href).searchParams.get('mode') || 'full';
const NARRATION_ON = MODE !== 'compact';
document.querySelector('.main').dataset.xNarration = NARRATION_ON ? 'on' : 'off';

/* boot: run the plugin the same way the host would */
window.__modules['dsh-sidebar-manager'].apply(context);

/* ---- scripted demo clock, driven by docs/render-demo.mjs ----
   Each call seeks the recorded animation to time t (seconds) and returns the
   state the recorder asserts on. Keeping the whole timeline in one seekable
   function is what makes the capture deterministic: the recorder can ask for
   frame 120 twice and get byte-identical output. */
function api(selector) { return document.querySelector(selector); }
function rows() { return [...document.querySelectorAll('nav.panelList_x9 button.panelRow_x9')]; }
function tabs() { return [...document.querySelectorAll('.tabs_x9 button[role="tab"]')]; }
function shell() { return api('.snc-shell'); }
function gear() { return api('.snc-bud'); }
function group() { return api('.snc-group'); }
function visibleRows() {
  return rows().filter((r) => r.offsetParent !== null && !r.hasAttribute('data-snc-hidden'));
}
function visibleTabs() {
  return tabs().filter((t) => t.offsetParent !== null && !t.hasAttribute('data-snc-hidden'));
}
function pointer(el, type, x, y) {
  /* the plugin listens on document, so a document-level move has no box of its
     own; only take the element centre when the target actually has geometry */
  const hasBox = el && typeof el.getBoundingClientRect === 'function';
  const box = hasBox ? el.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
  const cx = x === undefined ? box.left + box.width / 2 : x;
  const cy = y === undefined ? box.top + box.height / 2 : y;
  const event = new PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    clientX: cx, clientY: cy, pointerId: 1, pointerType: 'mouse',
    button: 0, buttons: type === 'pointerup' ? 0 : 1,
  });
  el.dispatchEvent(event);
}
/* how far the drag cue should set the captured pointer below the row top; the
   plugin wants the press point, not an approximation, or the row jumps */
function pressPoint(el, depth) {
  const box = el.getBoundingClientRect();
  return { x: box.left + 24, y: box.top + (depth === undefined ? 14 : depth) };
}
function midpoint(el) { const b = el.getBoundingClientRect(); return b.top + b.height / 2; }
/* the checkbox belonging to a sidebar row / a view tab, by visible label */
function check(name) {
  return [...document.querySelectorAll('.snc-check')]
    .find((b) => b.closest('.snc-entry')?.textContent.includes(name));
}
function tabCheck(name) {
  return [...document.querySelectorAll('.snc-tabbox')]
    .find((b) => b.closest('.snc-tabitem')?.textContent.includes(name));
}

/* ---- scripted pointer ----
   Two separate things, deliberately:
     * the sprite is decoration -- it is moved and pressed to match the input
       the timeline fabricates, so a viewer can see WHERE each gesture lands;
     * pointer() dispatches the real event into the plugin.
   The sprite never dispatches anything; if it did, the animation would stop
   being a recording of the plugin and become a puppet show of it. */
const sprite = document.getElementById('cursor');
const MOVE_GAP = 0.16;   /* seconds the sprite takes to travel between targets */

/* positions the sprite at an element (or a point) without animating */
function placeSprite(x, y) {
  sprite.dataset.visible = 'true';
  sprite.style.transform = `translate(${x - 3}px, ${y - 2}px)`;
}
/* a click lands: press, ripple, release */
function pressSprite() {
  sprite.dataset.pressed = 'true';
  setTimeout(() => { sprite.dataset.pressed = 'false'; }, 190);
}
function elementPoint(el, dx, dy) {
  const b = el.getBoundingClientRect();
  return { x: b.left + (dx === undefined ? b.width / 2 : dx), y: b.top + (dy === undefined ? b.height / 2 : dy) };
}

const timeline = [
  /* ---- 0.0s: folded, sprite rests over the group row ---- */
  { at: 0.0, run: () => {
      if (!shell().dataset.sncFolded.includes('true')) group().click();
      const p = elementPoint(group(), 30, 12);
      placeSprite(p.x, p.y);
    } },
  { hold: 0.9 },

  /* ---- 0.55s: the sprite travels to the group row, then presses it ---- */
  { at: 0.55, run: () => { const p = elementPoint(group(), 30, 12); placeSprite(p.x, p.y); } },
  { at: 0.82, run: () => pressSprite() },
  /* ---- 0.9s: unfold ---- */
  { at: 0.9, run: () => { if (shell().dataset.sncFolded === 'true') group().click(); } },
  { hold: 0.7 },

  /* ---- 1.6s: open settings (edit mode); the plugin unfolds first ---- */
  { at: 1.25, run: () => { const p = elementPoint(gear(), 10, 10); placeSprite(p.x, p.y); } },
  { at: 1.52, run: () => pressSprite() },
  { at: 1.6, run: () => gear().click() },
  { hold: 1.2 },

  /* ---- 2.8s / 3.3s: hide two extensions, sprite on each checkbox ---- */
  { at: 2.45, run: () => { placeSprite(...(() => { const p = elementPoint(check('示例面板 A'), 6, 8); return [p.x, p.y]; })()); } },
  { at: 2.72, run: () => pressSprite() },
  { at: 2.8, run: () => { const box = check('示例面板 A'); if (box && box.checked) box.click(); } },
  { hold: 0.5 },
  { at: 3.05, run: () => { const p = elementPoint(check('上下文洞察'), 6, 8); placeSprite(p.x, p.y); } },
  { at: 3.22, run: () => pressSprite() },
  { at: 3.3, run: () => { const box = check('上下文洞察'); if (box && box.checked) box.click(); } },
  { hold: 0.8 },

  /* ---- 4.1s: drag 记忆系统 above 插件 (sidebar, vertical axis) ---- */
  { at: 3.75, run: () => {
      const from = rows().find((r) => r.getAttribute('aria-label') === '记忆系统');
      const p = pressPoint(from);
      placeSprite(p.x, p.y);
    } },
  { at: 4.02, run: () => pressSprite() },
  { at: 4.1, run: () => {
      const from = rows().find((r) => r.getAttribute('aria-label') === '记忆系统');
      const handle = from.closest('.snc-entry').querySelector('.snc-drag');
      const p = pressPoint(from);
      pointer(handle, 'pointerdown', p.x, p.y);
      window.__drag = { p, from };
    } },
  { at: 4.15, run: () => {
      const { p, from } = window.__drag;
      pointer(document, 'pointermove', p.x, p.y - 4);
      pointer(document, 'pointermove', p.x, p.y - 14);
      placeSprite(p.x, p.y - 14);
    } },
  /* two steps so the lift threshold is crossed before any target test */
  { at: 4.5, run: () => {
      const { p } = window.__drag;
      const first = rows()[0];
      pointer(document, 'pointermove', p.x, midpoint(first) - 8);
      placeSprite(p.x, midpoint(first) - 8);
    } },
  { at: 4.9, run: () => {
      const { p } = window.__drag;
      const first = rows()[0];
      pointer(document, 'pointermove', p.x, midpoint(first) - 12);
      placeSprite(p.x, midpoint(first) - 12);
    } },
  { at: 5.2, run: () => {
      const { p } = window.__drag;
      pointer(document, 'pointerup', p.x, p.y - 60);
      placeSprite(p.x, p.y - 60);
      delete window.__drag;
    } },
  { hold: 0.9 },

  /* ---- 6.1s / 6.6s: hide two view tabs, sprite on each tab checkbox ---- */
  { at: 5.75, run: () => { const p = elementPoint(tabCheck('编队'), 6, 8); placeSprite(p.x, p.y); } },
  { at: 6.02, run: () => pressSprite() },
  { at: 6.1, run: () => { const box = tabCheck('编队'); if (box && box.checked) box.click(); } },
  { hold: 0.5 },
  { at: 6.35, run: () => { const p = elementPoint(tabCheck('画廊'), 6, 8); placeSprite(p.x, p.y); } },
  { at: 6.52, run: () => pressSprite() },
  { at: 6.6, run: () => { const box = tabCheck('画廊'); if (box && box.checked) box.click(); } },
  { hold: 0.9 },

  /* ---- 7.5s: drag 记忆系统 tab to the front ---- */
  { at: 7.15, run: () => {
      const from = tabs().find((t) => t.textContent.trim() === '记忆系统');
      const b = from.getBoundingClientRect();
      placeSprite(b.left + b.width / 2, b.top + b.height / 2);
    } },
  { at: 7.42, run: () => pressSprite() },
  { at: 7.5, run: () => {
      const from = tabs().find((t) => t.textContent.trim() === '记忆系统');
      const handle = from.closest('.snc-tabitem').querySelector('.snc-drag');
      const b = from.getBoundingClientRect();
      const p = { x: b.left + b.width / 2, y: b.top + b.height / 2 };
      pointer(handle, 'pointerdown', p.x, p.y);
      window.__drag = { p, from };
    } },
  { at: 7.55, run: () => {
      const { p } = window.__drag;
      pointer(document, 'pointermove', p.x + 4, p.y);
      pointer(document, 'pointermove', p.x + 14, p.y);
      placeSprite(p.x + 14, p.y);
    } },
  { at: 7.9, run: () => {
      const { p, from } = window.__drag;
      const score = [...document.querySelectorAll('.snc-tabitem')].find((i) => i.textContent.includes('编队'));
      if (score) {
        const b = score.getBoundingClientRect();
        pointer(document, 'pointermove', b.left + 10, p.y);
        placeSprite(b.left + 10, p.y);
      } else {
        pointer(document, 'pointermove', p.x - 100, p.y);
      }
    } },
  { at: 8.3, run: () => {
      const { p } = window.__drag;
      const first = document.querySelector('.snc-tabitem');
      const b = first.getBoundingClientRect();
      pointer(document, 'pointermove', b.left + 6, p.y);
      placeSprite(b.left + 6, p.y);
    } },
  { at: 8.6, run: () => {
      const { p } = window.__drag;
      pointer(document, 'pointerup', p.x - 150, p.y);
      placeSprite(p.x - 150, p.y);
      delete window.__drag;
    } },
  { hold: 0.8 },

  /* ---- 9.4s: leave edit mode ---- */
  { at: 9.15, run: () => { const p = elementPoint(gear(), 10, 10); placeSprite(p.x, p.y); } },
  { at: 9.32, run: () => pressSprite() },
  { at: 9.4, run: () => gear().click() },
  { hold: 0.8 },

  /* ---- 10.2s: fold again, to end where it began ---- */
  { at: 9.95, run: () => { const p = elementPoint(group(), 30, 12); placeSprite(p.x, p.y); } },
  { at: 10.12, run: () => pressSprite() },
  { at: 10.2, run: () => { if (shell().dataset.sncFolded === 'false') group().click(); } },
  { hold: 0.8 },
];

/* ---- narration ----
   Five phases, each a headline and one supporting line. The captions are the
   only part of this page a viewer reads rather than watches, so they are kept
   to what the picture cannot say by itself: which control was pressed, and
   what the state means afterwards. They share the phase boundaries of the
   timeline, so the words always describe the frame on screen. */
const NARRATION = [
  { from: 0.0,  title: '收起，只留一行。',            text: '点「扩展」，整组入口收起来，下方直接是工作区。' },
  { from: 0.9,  title: '再点一次，就回来了。',        text: '折叠状态会记住，下次打开还是这个样子。' },
  { from: 1.6,  title: '点齿轮，逐个决定。',          text: '每行前面出现勾选框，取消勾选即隐藏；灰掉的是已隐藏的。' },
  { from: 4.1,  title: '拖一下，放到顺手的位置。',    text: '拖动时其余行实时让位，松手即保存，下次还是这个顺序。' },
  { from: 9.4,  title: '再点一次，编辑结束。',        text: '齿轮变成对勾表示正在编辑中，退出后勾选框和手柄一起消失。' },
];
function narrationAt(t) {
  let current = NARRATION[0];
  for (const item of NARRATION) if (t >= item.from) current = item;
  return current;
}

window.demoFrame = (t) => {
  for (const step of timeline) {
    if (step.run && t >= step.at && !step.done) { step.done = true; step.run(); }
  }
  if (NARRATION_ON) {
    const narration = narrationAt(t);
    document.getElementById('headline').textContent = narration.title;
    document.getElementById('details').textContent = narration.text;
  }
  return {
    collapsed: shell()?.dataset.sncFolded ?? 'null',
    editing: shell()?.dataset.sncEditing ?? 'null',
    first: visibleRows()[0]?.getAttribute('aria-label') ?? '',
    rows: visibleRows().map((r) => r.getAttribute('aria-label')).join('|'),
    firstTab: visibleTabs()[0]?.textContent.trim() ?? '',
    tabs: visibleTabs().map((t) => t.textContent.trim()).join('|'),
  };
};

/* reset for repeated inspection in a live browser */
window.demoReset = () => {
  for (const step of timeline) delete step.done;
  try { window.localStorage.clear(); } catch {}
};
window.__ready = true;
</script>
